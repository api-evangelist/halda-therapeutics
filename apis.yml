name: Halda Therapeutics
description: >-
  Halda Therapeutics was a clinical-stage biotechnology company and Yale
  University spinout developing oral, targeted cancer therapies built on its
  proprietary RIPTAC (Regulated Induced Proximity TArgeting Chimera) platform, a
  novel "hold and kill" modality for the precision treatment of solid tumors. Its
  lead program, HLD-0915, is a first-in-class oral RIPTAC therapeutic in
  development for metastatic castration-resistant prostate cancer (mCRPC), with
  earlier-stage candidates spanning breast, lung, and other tumor types. Backed by
  investors including Canaan Partners, Halda was acquired by Johnson & Johnson in
  2025 for approximately $3.05 billion in cash, with its platform folded into
  Johnson & Johnson Innovative Medicine's oncology pipeline. As a therapeutics
  developer, Halda operated no public developer platform, API, or documentation
  surface; this profile is maintained in the API Evangelist network as a company
  identity and portfolio-graph record rather than an API producer.
